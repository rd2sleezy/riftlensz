[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riftlens"
version = "0.1.0"
description = "RiftLens analysis sidecar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "alembic>=1.14",
    "httpx>=0.28",
    "structlog>=24",
    "tenacity>=9",
    "av>=14",
    "opencv-python-headless>=4.10",
    "numpy>=2",
    "jinja2>=3.1",
    "typer>=0.15",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "syrupy>=4",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2",
    "types-pyyaml>=6",
    "pytest-cov>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["riftlens"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["riftlens", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["riftlens"]

[tool.importlinter]
root_packages = ["riftlens"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain isolation"
type = "forbidden"
source_modules = ["riftlens.domain"]
forbidden_modules = [
    "riftlens.api",
    "riftlens.adapters",
    "riftlens.pipeline",
    "riftlens.analysis",
    "riftlens.coaching",
    "riftlens.rofl",
    "riftlens.replay_host",
    "riftlens.gameplay",
    "riftlens.visual",
    "riftlens.vision",
    "riftlens.orchestration",
    "riftlens.validation",
]

[[tool.importlinter.contracts]]
name = "observation has no vision stack"
type = "forbidden"
source_modules = ["riftlens.domain.observation"]
forbidden_modules = [
    "cv2",
    "torch",
    "onnxruntime",
    "tensorflow",
    "openai",
    "anthropic",
    "electron",
    "riftlens.visual",
    "riftlens.vision",
]

