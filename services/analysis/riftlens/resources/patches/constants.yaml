# Patch constants that Data Dragon does not publish (minion gold, respawn timers,
# passive income, healthRegen units). Metrics and rules must resolve these through
# PatchDataProvider — never hardcode them beside a threshold.
#
# Values are wiki-derived / fixture-calibrated for Season 12 and labelled
# provisional. Timeline goldPerSecond and healthRegen units are QUARANTINED —
# no authoritative unit was found in Data Dragon, MATCH-V5 models, fixtures, or
# the design doc. Do not treat either field as a hard fact in H.6+ analysis.

default:
  passive_gold_per_second: 2.04
  passive_gold_start_ms: 110000
  # QUARANTINED. Observed timeline values are 0 / 20 / 30 (see NA1 fixtures).
  # Tenths-of-g/s is a plausible guess but is not documented. PatchDataProvider
  # ignores this key until a cited unit exists.
  gold_per_second_unit: null
  average_lane_minion_gold: 19.8
  jungle_minion_gold: 22.0
  # QUARANTINED. Data Dragon ``stats.hpregen`` is HP/5 for champion base stats,
  # but timeline ``championStats.healthRegen`` is a different field with no
  # schema comment. PatchDataProvider will not convert it.
  health_regen_period_ms: null
  respawn:
    # Commonly cited Summoner's Rift BRW table (seconds by champion level).
    base_seconds_by_level:
      [0, 10, 10, 12, 12, 14, 16, 20, 25, 28, 32.5, 35, 37.5, 40, 42.5, 45, 47.5, 50, 52.5]
    scaling_start_ms: 900000
    scaling_per_30s: 0.00425
    scaling_cap: 0.50

patches:
  "12.4": {}
